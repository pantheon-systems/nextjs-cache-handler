# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/nextjs-cache-handler.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
# Every version update lands in one weekly PR (multi-ecosystem group `dependencies`).
# Security updates are not part of the group; each opens as its own PR.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
updates:
  # npm - root package
  - package-ecosystem: "npm"
    directory: "/"
    ignore:
      - dependency-name: "@pantheon-systems/*"
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  # npm - example app
  - package-ecosystem: "npm"
    directory: "/example"
    ignore:
      - dependency-name: "@pantheon-systems/*"
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
